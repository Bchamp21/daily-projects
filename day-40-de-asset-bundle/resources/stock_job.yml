resources:
  jobs:
    stock_pipeline:
      name: stock-pipeline-${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 18 ? * MON-FRI"
        timezone_id: America/Denver
      email_notifications:
        on_failure: ["${var.alert_email}"]
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../src_notebooks/01_bronze_ingest.py
          max_retries: 2
          min_retry_interval_millis: 60000
          timeout_seconds: 1800
        - task_key: silver_clean
          depends_on: [{task_key: bronze_ingest}]
          notebook_task:
            notebook_path: ../src_notebooks/02_silver_clean.py
          max_retries: 1
          timeout_seconds: 1800
        - task_key: recon_check
          depends_on: [{task_key: silver_clean}]
          notebook_task:
            notebook_path: ../src_notebooks/03_recon_check.py
          timeout_seconds: 900
        - task_key: dbt_gold
          depends_on: [{task_key: recon_check}]
          dbt_task:
            commands: ["dbt deps", "dbt build --target ${bundle.target}"]
          timeout_seconds: 3600
